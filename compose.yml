services:
  postgres:
    image: postgres:17-alpine
    env_file:
      - ./infra/postgres/.env
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payment_api"]
      interval: 5s
      retries: 15
    networks:
      - app-db

  kafka:
    image: apache/kafka:4.0.1
    container_name: kafka
    hostname: kafka
    env_file:
      - ./infra/kafka/.env
    ports: ["9092:9092"]
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s
    networks:
      - kafka-net

  kafka-init:
    image: apache/kafka:4.0.1
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_started
    volumes:
      - ./infra/kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    restart: "no"
    networks:
      - kafka-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "9081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - kafka-net
    labels:
      org.springframework.boot.ignore: "true"

  prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    ports: ["9090:9090"]
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on: [payment-api, payment-processor, audit-service]

  grafana:
    image: grafana/grafana:11.6.0
    profiles: [observability]
    ports: ["3000:3000"]
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/payment-lab-dashboard.json:/var/lib/grafana/dashboards/payment-lab-dashboard.json:ro
    depends_on: [prometheus]

  payment-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: payment-api
    env_file:
      - ./payment-api/.env
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app-db
      - kafka-net

  payment-processor:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: payment-processor
    env_file:
      - ./payment-processor/.env
    ports: ["8081:8081"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app-db
      - kafka-net

  audit-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_MODULE: audit-service
    env_file:
      - ./audit-service/.env
    ports: ["8082:8082"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - app-db
      - kafka-net

volumes:
  pgdata:

networks:
  app-db:
    driver: bridge
  kafka-net:
    driver: bridge