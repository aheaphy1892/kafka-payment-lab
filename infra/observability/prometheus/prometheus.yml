global:
  scrape_interval: 15s
scrape_configs:
  - job_name: payment-api
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: [payment-api:8080] }]
  - job_name: payment-processor
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: [payment-processor:8081] }]
  - job_name: audit-service
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: [audit-service:8082] }]
